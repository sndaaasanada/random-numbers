<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Edge Home Proxy</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div class="logo">⇄</div>
      <div><h1>Edge Home Proxy</h1><p>Microsoft Edge 用プロキシ</p></div>
    </header>
    <div id="status" class="status off"><span></span><b>未接続</b></div>
    <label>サーバーのホスト名 / IP<input id="host" placeholder="vpn.example.net" autocomplete="url"></label>
    <div class="row">
      <label>ポート<input id="port" type="number" min="1" max="65535" value="8443"></label>
      <label>ユーザー名<input id="username" autocomplete="username"></label>
    </div>
    <label>パスワード<input id="password" type="password" autocomplete="current-password"></label>
    <button id="toggle">接続</button>
    <p id="message" role="status"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
